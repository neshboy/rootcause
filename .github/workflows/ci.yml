name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  # ubuntu-latest GitHub-hosted runners ship a real Docker daemon, so the
  # real-Docker-gated integration suite (tests/docker-live.test.ts, normally
  # excluded from `npm test` - see vitest.config.ts) can genuinely run here
  # too, against real containers it builds and tears down itself.
  test-live-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:live
